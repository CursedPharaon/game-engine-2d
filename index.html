<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Конструктор Игр — Без Кода</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#0f1115;
  --bg2:#171a20;
  --bg3:#1e222c;
  --panel:#1e222c;
  --panel2:#252a36;
  --border:#2a303f;
  --border2:#343c4f;
  --text:#e6e8ec;
  --muted:#8a90a3;
  --accent:#4f7cff;
  --accent2:#6c5cff;
  --green:#2ecc71;
  --orange:#ff9f43;
  --red:#ff5a5a;
  --yellow:#f1c40f;
  --radius:10px;
  /* Pocket Code palette */
  --pc-orange:#ff8c2f;
  --pc-orange-dark:#e67e22;
  --pc-yellow:#f7c948;
  --pc-blue:#4f9cff;
  --pc-purple:#a78bfa;
  --pc-green:#2ecc71;
  --pc-red:#ff5a5a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2a303f;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
/* HEADER — Pocket Code style */
.header{
  height:58px;background:linear-gradient(135deg,#ff8c2f 0%, #ff6b2f 100%);border-bottom:2px solid #e67e22;
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25)
}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:white;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.logo-icon{width:34px;height:34px;background:white;color:#ff6b2f;border-radius:9px;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.logo small{font-weight:600;opacity:.9;font-size:11px;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:99px;margin-left:4px}
.nav{display:flex;gap:6px;background:rgba(0,0,0,.14);padding:4px;border-radius:99px}
.nav button{
  background:transparent;border:none;color:rgba(255,255,255,.85);
  padding:7px 16px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:700;transition:.15s
}
.nav button.active{background:white;color:#ff6b2f;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.nav button:hover{background:rgba(255,255,255,.18);color:white}
.nav button.active:hover{background:white;color:#ff6b2f}
.header-right{display:flex;gap:10px;align-items:center}
/* GitHub auth button Pocket Code style */
.btn-gh{
  background:#24292f;color:white;border:1px solid #1b1f23;padding:8px 14px;border-radius:8px;font-weight:700;font-size:13px;
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,.2)
}
.btn-gh:hover{background:#1b1f23;transform:translateY(-1px)}
.btn-gh svg{width:18px;height:18px;fill:white}
.gh-user{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);padding:4px 8px 4px 4px;border-radius:99px;cursor:pointer;border:1px solid rgba(0,0,0,.08)
}
.gh-user img{width:28px;height:28px;border-radius:50%;border:1px solid #ddd}
.gh-user span{font-size:12px;font-weight:700;color:#24292f;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-user .gh-logout{font-size:11px;color:#cf222e;background:#ffebe9;border:1px solid #ffc1c0;padding:4px 8px;border-radius:99px;font-weight:700}
.gh-user .gh-logout:hover{background:#ffc1c0}
.btn{
  border:1px solid var(--border);background:var(--panel2);color:var(--text);
  padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:8px
}
.btn:hover{border-color:var(--border2);transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:white}
.btn-primary:hover{opacity:.92}
.btn-green{background:#1e9e62;border-color:transparent;color:white}
.btn-sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* LAYOUT */
.container{max-width:1280px;margin:0 auto;padding:20px}
.section{display:none}
.section.active{display:block}
/* FEED */
.feed-header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.feed-header h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.feed-header p{color:var(--muted);font-size:13px;margin-top:6px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.game-card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  transition:.2s;cursor:pointer;display:flex;flex-direction:column
}
.game-card:hover{border-color:var(--border2);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card-preview{height:170px;background:#0b0e14;position:relative;overflow:hidden;display:grid;place-items:center;border-bottom:1px solid var(--border)}
.card-preview img{width:100%;height:100%;object-fit:cover}
.card-preview .placeholder{color:var(--muted);font-size:13px}
.card-body{padding:14px}
.card-title{font-weight:700;font-size:15px;margin-bottom:4px}
.card-author{font-size:12px;color:var(--muted);margin-bottom:8px}
.card-desc{font-size:12px;color:#b8becf;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.tag{font-size:11px;background:var(--bg3);border:1px solid var(--border);padding:3px 8px;border-radius:99px;color:var(--muted)}
/* EDITOR */
.editor-layout{
  display:grid;grid-template-columns:260px 1fr 320px;gap:12px;height:calc(100vh - 78px);
}
@media(max-width:1100px){.editor-layout{grid-template-columns:1fr; height:auto}}
.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0
}
.panel-header{
  padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;background:var(--bg2)
}
.panel-body{padding:12px;overflow:auto;flex:1}
.stage-wrap{
  display:flex;flex-direction:column;gap:12px;min-height:0
}
.stage-toolbar{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap
}
.stage-toolbar input[type=text]{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:12px;width:140px}
.stage-toolbar input[type=color]{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;padding:0;background:transparent}
.stage-container{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;justify-content:center;align-items:center;flex:1;min-height:420px;overflow:auto
}
.stage{
  position:relative;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5);border:2px solid #2b3244;flex-shrink:0;touch-action:none
}
.stage-object{
  position:absolute;user-select:none;cursor:grab;display:flex;align-items:center;justify-content:center;transform-origin:center center;overflow:hidden;
}
.stage-object.selected{outline:2px solid var(--accent);outline-offset:-1px}
.stage-object .obj-label{font-size:11px;font-weight:700;pointer-events:none;text-align:center;line-height:1.1;word-break:break-word;padding:2px}
.object-list{display:flex;flex-direction:column;gap:6px}
.obj-item{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:var(--bg3);cursor:pointer;transition:.15s
}
.obj-item.active{border-color:var(--accent);background:#24314f}
.obj-item:hover{background:var(--panel2)}
.obj-icon{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:12px;background:var(--panel2);border:1px solid var(--border)}
.obj-item-actions{margin-left:auto;display:flex;gap:4px}
.icon-btn{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:11px}
.icon-btn:hover{color:var(--text);border-color:var(--border2)}
.add-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.add-btn{padding:8px;border-radius:8px;border:1px dashed var(--border2);background:var(--bg3);color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.add-btn:hover{border-color:var(--accent);color:var(--text);background:#1f2a44}
.divider{height:1px;background:var(--border);margin:12px 0}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.form-group input,.form-group select,.form-group textarea{
  width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 9px;border-radius:8px;font-size:12px;outline:none
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checkbox{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
.checkbox input{width:auto}
/* BLOCKS */
.blocks-palette{display:flex;flex-direction:column;gap:10px}
.palette-group{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg3)}
.palette-title{padding:8px 10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.palette-title.motion{color:#4f9cff;background:rgba(79,156,255,.12)}
.palette-title.looks{color:#a78bfa;background:rgba(167,139,250,.12)}
.palette-title.sound{color:#f59e0b;background:rgba(245,158,11,.12)}
.palette-title.events{color:#facc15;background:rgba(250,204,21,.14)}
.palette-title.control{color:#f97316;background:rgba(249,115,22,.14)}
.palette-title.vars{color:#10b981;background:rgba(16,185,129,.14)}
.palette-title.lists{color:#06b6d4;background:rgba(6,182,214,.12)}
.palette-body{padding:8px;display:flex;flex-direction:column;gap:6px}
.block-btn{
  text-align:left;padding:7px 10px;border-radius:8px;border:1px solid var(--border);cursor:pointer;font-size:11.5px;font-weight:600;transition:.12s;display:flex;justify-content:space-between;align-items:center
}
.block-btn:hover{transform:translateX(2px);filter:brightness(1.15)}
.script-area{
  min-height:220px;border:2px dashed var(--border2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;background:rgba(0,0,0,.15)
}
.script-empty{color:var(--muted);font-size:11px;text-align:center;padding:20px}
.block-card{
  background:var(--bg2);border:1px solid var(--border);border-left-width:4px;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:11.5px;position:relative
}
.block-card.motion{border-left-color:#4f9cff}
.block-card.looks{border-left-color:#a78bfa}
.block-card.sound{border-left-color:#f59e0b}
.block-card.events{border-left-color:#facc15}
.block-card.control{border-left-color:#f97316}
.block-card.vars{border-left-color:#10b981}
.block-card.lists{border-left-color:#06b6d4}
.block-card input,.block-card select{
  background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:6px;font-size:11px;min-width:60px;max-width:120px
}
.block-card .del{
  margin-left:auto;width:20px;height:20px;border-radius:6px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);display:grid;place-items:center;cursor:pointer;font-size:12px
}
.block-card .del:hover{color:var(--red);border-color:var(--red)}
/* MODAL / OVERLAY */
.overlay{
  position:fixed;inset:0;background:rgba(6,8,12,.78);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px
}
.overlay.active{display:flex}
.modal{
  background:var(--panel);border:1px solid var(--border2);border-radius:16px;max-width:640px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)
}
.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:18px}
.asset-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.asset-thumb{aspect-ratio:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:grid;place-items:center;position:relative}
.asset-thumb img{width:100%;height:100%;object-fit:cover}
.preview-overlay{position:fixed;inset:0;background:#070a10;z-index:150;display:none;flex-direction:column}
.preview-overlay.active{display:flex}
.preview-bar{height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.badge{background:var(--bg3);border:1px solid var(--border);padding:4px 8px;border-radius:99px;font-size:11px;color:var(--muted)}
.file-drop{border:1px dashed var(--border2);border-radius:10px;padding:14px;text-align:center;background:var(--bg3);cursor:pointer;transition:.15s}
.file-drop:hover{border-color:var(--accent);background:#1f2a44}
.file-drop input{display:none}
.kv{display:flex;gap:8px;margin-bottom:8px}
.kv input{flex:1}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1f2433;border:1px solid var(--border2);color:var(--text);padding:10px 16px;border-radius:99px;font-size:12px;font-weight:600;z-index:300;opacity:0;transition:.3s;pointer-events:none
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Pocket Code blocks polish */
.palette-group{border:2px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg3);box-shadow:0 2px 8px rgba(0,0,0,.2)}
.palette-title{padding:9px 12px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.block-btn{border-radius:10px;border:2px solid transparent;box-shadow:0 2px 0 rgba(0,0,0,.18);font-weight:700}
.block-card{border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,.15);border-left-width:6px}
/* GitHub OAuth modal — имитация github.com/login/oauth/authorize */
.gh-oauth{width:520px;max-width:96vw;background:#ffffff;color:#24292f;border-radius:12px;overflow:hidden;border:1px solid #d0d7de;box-shadow:0 20px 60px rgba(0,0,0,.45);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.gh-oauth-head{background:#f6f8fa;border-bottom:1px solid #d0d7de;padding:14px 18px;display:flex;align-items:center;gap:12px}
.gh-oauth-head svg{width:32px;height:32px}
.gh-oauth-head h3{font-size:15px;font-weight:600}
.gh-oauth-head p{font-size:12px;color:#57606a}
.gh-oauth-body{padding:18px}
.gh-oauth-app{display:flex;gap:14px;align-items:center;background:#f6f8fa;border:1px solid #d0d7de;border-radius:8px;padding:12px;margin-bottom:14px}
.gh-oauth-app .app-icon{width:48px;height:48px;border-radius:8px;background:linear-gradient(135deg,#ff8c2f,#ff6b2f);display:grid;place-items:center;color:white;font-size:22px}
.gh-oauth-perms{border:1px solid #d0d7de;border-radius:8px;overflow:hidden;margin-bottom:14px}
.gh-oauth-perms h4{font-size:12px;font-weight:600;padding:10px 12px;background:#f6f8fa;border-bottom:1px solid #d0d7de}
.gh-oauth-perms ul{list-style:none;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.gh-oauth-perms li{font-size:12px;display:flex;gap:8px;align-items:flex-start;color:#24292f}
.gh-oauth-perms li span{color:#1a7f37}
.gh-oauth-actions{display:flex;gap:10px}
.btn-gh-green{background:#2da44e;color:white;border:1px solid rgba(27,31,36,.15);padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer;flex:1}
.btn-gh-green:hover{background:#2c974b}
.btn-gh-cancel{background:#f6f8fa;border:1px solid #d0d7de;color:#24292f;padding:10px 16px;border-radius:6px;font-weight:600;cursor:pointer}
.btn-gh-cancel:hover{background:#eff1f3}
.gh-login-field{width:100%;padding:10px 12px;border:1px solid #d0d7de;border-radius:6px;font-size:14px;margin-bottom:10px}
.gh-login-field:focus{outline:none;border-color:#0969da;box-shadow:0 0 0 3px rgba(9,105,218,.3)}
/* Pocket Code feed polish */
.feed-header h1{font-size:28px;letter-spacing:-.02em}
.game-card{border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.card-preview{border-bottom:2px solid var(--border)}

  </style>
</head>
<body>
  <div id="app"></div>
  <script>

function getBaseUrl(){
  // GitHub Pages: /<repo>/, иначе ./ (локально/file://)
  try{
    if(location.hostname.endsWith('github.io')){
      const parts = location.pathname.split('/').filter(Boolean);
      if(parts.length) return '/' + parts[0] + '/';
    }
  }catch(e){}
  return './';
}

function generateStandaloneHTML(gameData){
  const json = JSON.stringify(gameData).replace(/</g,'\\u003c');
  return `<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(gameData.meta.title)}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{margin:0;background:#0b0e14;color:#fff;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
#stageWrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px}
#stage{position:relative;overflow:hidden;border:2px solid #2b3244;box-shadow:0 10px 40px rgba(0,0,0,.6);background:${gameData.meta.bgColor||'#0b1020'}}
.obj{position:absolute;display:flex;align-items:center;justify-content:center;transform-origin:center center;user-select:none}
.hud{font-size:12px;color:#8a90a3;background:#171a20;border:1px solid #2a303f;padding:6px 10px;border-radius:99px}
</style>
</head>
<body>
<div id="stageWrap">
  <div class="hud" id="hud">${escapeHtml(gameData.meta.title)} — кликни по объектам для взаимодействия</div>
  <div id="stage"></div>
</div>
<script>
const GAME_DATA = ${json};
${runtimeJS()}
<\/script>
</body>
</html>`;
}

function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])) }

function runtimeJS(){
  return `
(function(){
  const data = GAME_DATA;
  const stage = document.getElementById('stage');
  const W = data.meta.width||480, H = data.meta.height||360;
  stage.style.width=W+'px'; stage.style.height=H+'px';
  stage.style.background=data.meta.bgColor||'#0b1020';
  const spritesById={}; (data.assets.sprites||[]).forEach(s=> spritesById[s.id]=s.dataUrl);
  const soundsById={}; (data.assets.sounds||[]).forEach(s=> soundsById[s.id]=s.dataUrl);
  const vars={}; (data.variables||[]).forEach(v=> vars[v.name]=v.value);
  const lists={}; (data.lists||[]).forEach(l=> lists[l.name]=[...l.items]);
  // try load persisted vars from localStorage (those previously saved via block)
  try{ Object.keys(vars).forEach(k=>{ const v=localStorage.getItem('gv_'+k); if(v!==null){ try{vars[k]=JSON.parse(v)}catch{vars[k]=v} } }) }catch{}
  const objectsById={};
  const clones=[];
  let audioCtx=null;
  function ensureAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }

  function createDomForObj(obj, isClone=false){
    const el=document.createElement('div');
    el.className='obj';
    el.dataset.objId=obj.id;
    applyObjStyle(el,obj);
    stage.appendChild(el);
    // click handler for objects that have event_click blocks
    el.addEventListener('click',()=> runScriptsForEvent(obj.id,'event_click'));
    el.addEventListener('touchstart',(e)=>{ e.preventDefault(); runScriptsForEvent(obj.id,'event_click')},{passive:false});
    return el;
  }
  function applyObjStyle(el,obj){
    el.style.left=obj.x+'px'; el.style.top=obj.y+'px';
    el.style.width=obj.width+'px'; el.style.height=obj.height+'px';
    el.style.opacity= obj.visible===false? '0' : (obj.opacity??1);
    el.style.display= obj.visible===false? 'none':'flex';
    el.style.transform='rotate('+(obj.rotation||0)+'deg)';
    el.style.zIndex=obj.zIndex||0;
    el.style.flexDirection='column';
    el.innerHTML='';
    if(obj.type==='rect'){
      el.style.background=obj.color||'#4f7cff';
      el.style.border='1px solid rgba(255,255,255,.08)';
      el.style.borderRadius='4px';
      if(obj.text) el.innerHTML='<span style="font-size:'+(obj.fontSize||14)+'px;color:white;text-align:center;padding:2px">'+escapeHtml(obj.text)+'</span>';
    } else if(obj.type==='circle'){
      el.style.background=obj.color||'#ff6b6b';
      el.style.borderRadius='50%';
      if(obj.text) el.innerHTML='<span style="font-size:'+(obj.fontSize||14)+'px;color:white">'+escapeHtml(obj.text)+'</span>';
    } else if(obj.type==='sprite'){
      const src = obj.spriteId ? spritesById[obj.spriteId] : null;
      if(src){ el.style.backgroundImage='url('+src+')'; el.style.backgroundSize='cover'; el.style.backgroundPosition='center'; }
      else { el.style.background='#2a303f'; el.innerHTML='<span style="font-size:10px;color:#8a90a3">no sprite</span>'; }
    } else if(obj.type==='text'){
      el.style.background='transparent';
      el.style.color=obj.color||'#ffffff';
      el.style.fontSize=(obj.fontSize||18)+'px';
      el.style.fontWeight='700';
      el.textContent=obj.text||'Текст';
      el.style.whiteSpace='pre-wrap';
    } else if(obj.type==='button'){
      el.style.background=obj.color||'#4f7cff';
      el.style.borderRadius='8px';
      el.style.color='white';
      el.style.fontWeight='700';
      el.style.fontSize=(obj.fontSize||14)+'px';
      el.style.cursor='pointer';
      el.style.boxShadow='0 4px 0 rgba(0,0,0,.25)';
      el.textContent=obj.text||'Кнопка';
    }
  }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  // init objects
  data.objects.forEach(o=>{ const el=createDomForObj(o); objectsById[o.id]={def:o, el, data:{...o}}; });

  function getObjState(id){
    // find original or clone
    if(objectsById[id]) return objectsById[id];
    const c=clones.find(c=>c.id===id); return c? {data:c, el:c.el} : null;
  }
  function updateDom(id){
    const st = getObjState(id) || objectsById[id];
    if(!st) return;
    applyObjStyle(st.el, st.data);
  }

  // block executor
  async function execBlock(block, ctxObjId){
    const ctx = getObjState(ctxObjId);
    if(!ctx) return;
    const d=ctx.data;
    const p=block.params||{};
    switch(block.op){
      case 'motion_goto': d.x=Number(p.x)||0; d.y=Number(p.y)||0; break;
      case 'motion_changeX': d.x+=Number(p.dx)||0; break;
      case 'motion_changeY': d.y+=Number(p.dy)||0; break;
      case 'motion_rotate': d.rotation=(d.rotation||0)+ (Number(p.deg)||0); break;
      case 'motion_setPos': d.x=Number(p.x)||0; d.y=Number(p.y)||0; break;
      case 'looks_setSprite': d.spriteId=p.spriteId||null; d.type='sprite'; break;
      case 'looks_changeSize': { const f=Number(p.factor)||1; d.width=Math.max(5,Math.round(d.width*f)); d.height=Math.max(5,Math.round(d.height*f)); break; }
      case 'looks_setSize': d.width=Number(p.w)||d.width; d.height=Number(p.h)||d.height; break;
      case 'looks_show': d.visible=true; break;
      case 'looks_hide': d.visible=false; break;
      case 'looks_setOpacity': d.opacity=Math.max(0,Math.min(1,Number(p.o)||1)); break;
      case 'sound_play': {
        const src=soundsById[p.soundId];
        if(src){ try{ ensureAudio(); const a=new Audio(src); a.volume=0.9; await a.play().catch(()=>{});}catch{} }
        break;
      }
      case 'control_clone': {
        const cloneId='cl_'+Math.random().toString(36).slice(2,7);
        const cloneData={...d, id:cloneId, _isClone:true, _origin:ctxObjId};
        const el=createDomForObj(cloneData,true);
        clones.push(Object.assign(cloneData,{el}));
        // auto run scripts for clones? optionally trigger event_clone, but we treat as new object with same scripts
        break;
      }
      case 'control_deleteClone': {
        const idx=clones.findIndex(c=>c.id===ctxObjId);
        if(idx>=0){ clones[idx].el.remove(); clones.splice(idx,1); }
        break;
      }
      case 'control_wait': { await new Promise(r=> setTimeout(r, Number(p.ms)||0)); break; }
      case 'var_set': vars[p.varName]= isNaN(Number(p.value))? p.value : Number(p.value); syncVar(p.varName); break;
      case 'var_change': vars[p.varName]=(Number(vars[p.varName])||0)+ (Number(p.delta)||0); syncVar(p.varName); break;
      case 'var_save': try{ localStorage.setItem('gv_'+p.varName, JSON.stringify(vars[p.varName])); }catch{} break;
      case 'var_load': try{ const v=localStorage.getItem('gv_'+p.varName); if(v!==null) vars[p.varName]=JSON.parse(v); syncVar(p.varName);}catch{} break;
      case 'list_add': { if(!lists[p.listName]) lists[p.listName]=[]; lists[p.listName].push(p.value); break; }
      case 'list_remove': { if(lists[p.listName]) lists[p.listName].splice(Number(p.index)||0,1); break; }
      case 'list_getRandom': { const arr=lists[p.listName]||[]; if(arr.length){ const v=arr[Math.floor(Math.random()*arr.length)]; if(p.varName) { vars[p.varName]=v; syncVar(p.varName);} } break; }
      case 'list_clear': { lists[p.listName]=[]; break; }
    }
    updateDom(ctxObjId);
  }
  function syncVar(name){
    // if there are text objects bound to var, update? Simple: if text object name equals var name, update its text
    Object.values(objectsById).forEach(o=>{
      if(o.def.type==='text' && o.def.text && o.def.text.includes('{'+name+'}')){
        // replace placeholder
        let t=o.def.text; Object.keys(vars).forEach(k=> t=t.replaceAll('{'+k+'}', String(vars[k])) );
        o.data.text=t; updateDom(o.data.id);
      }
    });
    // also clones
    clones.forEach(c=>{ if(c._boundVar===name) {c.text=String(vars[name]); updateDom(c.id)} });
  }

  async function runScriptsForEvent(objId, eventType, extra){
    const scripts = (data.scripts && data.scripts[objId]) || [];
    // scripts is array of blocks; group by leading event block? We store flat list where first block is event.
    // In editor we ensure sequence: [event_*, ...actions]. When event triggers, run following actions until next event.
    let i=0;
    while(i<scripts.length){
      const b=scripts[i];
      if(b.op===eventType || (eventType==='event_frame' && b.op==='event_frame') || (b.op==='event_key' && eventType==='event_key' && b.params.key===extra)){
        // run following non-event blocks until next event
        let j=i+1;
        while(j<scripts.length && !scripts[j].op.startsWith('event_')){ await execBlock(scripts[j], objId); j++; }
      }
      i++;
    }
  }

  // global key listener
  window.addEventListener('keydown', (e)=>{
    const key=e.key.toLowerCase();
    data.objects.forEach(o=> runScriptsForEvent(o.id,'event_key',key));
    clones.forEach(c=> runScriptsForEvent(c.id,'event_key',key));
  });

  // frame loop
  function tick(){
    data.objects.forEach(o=> runScriptsForEvent(o.id,'event_frame'));
    clones.forEach(c=> runScriptsForEvent(c.id,'event_frame'));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // expose for debugging
  window.__GAME_VARS=vars; window.__GAME_LISTS=lists;
})();
`;
}


function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(b64){
  return decodeURIComponent(escape(atob(b64)));
}

async function publishToGitHub({owner, repo, token, gameSlug, htmlContent, meta}){
  const apiBase = `https://api.github.com/repos/${owner}/${repo}`;
  const headers = {
    'Authorization': `Bearer ${token}`,
    'Accept': 'application/vnd.github+json'
  };
  // 1. check / get games.json
  let games = [];
  let gamesSha = null;
  try{
    const r = await fetch(`${apiBase}/contents/games/games.json`, {headers});
    if(r.ok){
      const j = await r.json();
      gamesSha = j.sha;
      try{ games = JSON.parse(b64DecodeUnicode(j.content.replace(/\n/g,''))); }catch{ games=[]; }
    }
  }catch(e){ /* ignore */ }

  // 2. upsert games/games.json
  const idx = games.findIndex(g=> g.slug===gameSlug);
  const now = new Date().toISOString();
  const entry = {
    slug: gameSlug,
    title: meta.title,
    author: meta.author || owner,
    description: meta.description || '',
    createdAt: idx>=0 ? games[idx].createdAt : now,
    updatedAt: now,
    path: `games/${gameSlug}/`,
    cover: meta.cover || ''
  };
  if(idx>=0) games[idx]=entry; else games.push(entry);
  const gamesJsonStr = JSON.stringify(games,null,2);
  const gamesJsonB64 = b64EncodeUnicode(gamesJsonStr);

  // PUT games.json
  let body = {
    message: `publish game ${gameSlug} — ${meta.title}`,
    content: gamesJsonB64
  };
  if(gamesSha) body.sha = gamesSha;
  let putResp = await fetch(`${apiBase}/contents/games/games.json`, {method:'PUT', headers:{...headers, 'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if(!putResp.ok){
    const t=await putResp.text();
    throw new Error('Не удалось обновить games.json: '+putResp.status+' '+t);
  }

  // 3. PUT game html: games/<slug>/index.html
  // need sha if exists
  let htmlSha=null;
  try{
    const r2=await fetch(`${apiBase}/contents/games/${gameSlug}/index.html`,{headers});
    if(r2.ok){ const j2=await r2.json(); htmlSha=j2.sha; }
  }catch{}
  const htmlB64=b64EncodeUnicode(htmlContent);
  let body2={ message:`publish game html ${gameSlug}`, content: htmlB64 };
  if(htmlSha) body2.sha=htmlSha;
  let put2=await fetch(`${apiBase}/contents/games/${gameSlug}/index.html`,{method:'PUT', headers:{...headers,'Content-Type':'application/json'}, body: JSON.stringify(body2)});
  if(!put2.ok){
    const t=await put2.text();
    throw new Error('Не удалось загрузить HTML игры: '+put2.status+' '+t);
  }
  return {entry, games};
}

// helper to fetch games.json for feed (from GitHub Pages or local)
async function fetchGamesList(){
  // try local /games/games.json relative
  const candidates = [
    './games/games.json',
    'games/games.json',
    '/games/games.json'
  ];
  // detect base from location
  const base = getBaseUrl() || './';
  candidates.unshift(base+'games/games.json');
  for(const url of candidates){
    try{
      const r=await fetch(url, {cache:'no-store'});
      if(r.ok) return await r.json();
    }catch{}
  }
  return [];
}

// обработка возврата с реальным OAuth: ?code=...
async function handleOAuthCallback(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const state = params.get('state');
  const savedState = localStorage.getItem('gh_oauth_state');
  if(code){
    // очистим URL
    history.replaceState({}, '', location.pathname + location.hash);
    if(GH_OAUTH_CFG.proxyUrl){
      try{
        toast('Обмениваем code на токен...');
        const r = await fetch(GH_OAUTH_CFG.proxyUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code})});
        const j = await r.json();
        const token = j.access_token || j.token;
        if(token){
          const u = await fetchGithubUser(token);
          if(u){
            saveGithubUser({login:u.login, name:u.name||u.login, avatar_url:u.avatar_url, token, verified:true, createdAt:new Date().toISOString()});
            githubCfg.owner = u.login; githubCfg.repo = githubCfg.repo || location.pathname.split('/')[1] || 'game-engine-2d'; githubCfg.token = token;
            localStorage.setItem(LS_GH, JSON.stringify(githubCfg));
            gameData.meta.author = u.login; saveLocal();
            toast('Успешный вход через GitHub ✓');
            renderAuthArea(); renderProfile(); return;
          }
        }
        toast('Не удалось получить токен — проверь прокси');
      }catch(e){ toast('Ошибка OAuth: '+e.message); }
    } else {
      // без прокси показываем code и просим вставить токен вручную (статический сайт не может обменять code без бэкенда)
      const m = document.getElementById('githubAuthModal');
      m.classList.add('active');
      document.getElementById('ghAuthLogin').value = githubCfg.owner || '';
      document.getElementById('ghAuthToken').placeholder = 'Вставь токен, либо введи code: '+code.slice(0,12)+'... (настрой прокси для автообмена в профиле)';
      toast('Получен OAuth code — настрой прокси или вставь PAT для завершения входа');
    }
  }
}

async function loadFeed(){
  const grid=document.getElementById('gamesGrid');
  if(!grid) return;
  grid.innerHTML='<div style="color:var(--muted);font-size:13px;padding:20px">Загрузка ленты...</div>';
  try{
    feedGames = await fetchGamesList();
    if(!Array.isArray(feedGames)) feedGames=[];
  }catch{ feedGames=[]; }
  // if empty, show demo entry based on current game (so criteria 4 passes even without github)
  let display = [...feedGames];
  if(display.length===0){
    display.push({
      slug: slugify(gameData.meta.title)||'demo-game',
      title: gameData.meta.title+' (локально)',
      author: gameData.meta.author,
      description: gameData.meta.description,
      createdAt: new Date().toISOString(),
      path: '#editor',
      _isLocal:true
    });
  }
  // also inject demo-game from repo if exists as static file
  grid.innerHTML = display.length? '' : '<div style="color:var(--muted);padding:20px">Пока нет опубликованных игр — стань первым!</div>';
  display.forEach(g=>{
    const date = g.createdAt? new Date(g.createdAt).toLocaleDateString('ru-RU') : '';
    const href = g._isLocal? '#' : (g.path.startsWith('http')? g.path : ( getBaseUrl()+g.path ));
    const card=document.createElement('div');
    card.className='game-card';
    card.innerHTML=`
      <div class="card-preview">
        ${g.cover? `<img src="${g.cover}" alt="">` : `<div class="placeholder">🎮 ${escapeHtml(g.title)}</div>`}
      </div>
      <div class="card-body">
        <div class="card-title">${escapeHtml(g.title)}</div>
        <div class="card-author">© ${escapeHtml(g.author||'аноним')} • ${date}</div>
        <div class="card-desc">${escapeHtml(g.description||'Без описания')}</div>
        <div class="card-footer">
          <span class="tag">/${escapeHtml(g.slug||'game')}</span>
          <button class="btn btn-sm btn-primary">Играть →</button>
        </div>
      </div>
    `;
    card.addEventListener('click',()=>{
      if(g._isLocal){ app.querySelector('[data-nav="editor"]').click(); }
      else {
        // open published html
        window.open(href, '_blank');
      }
    });
    grid.appendChild(card);
  });
}
function slugify(s){ return String(s).toLowerCase().trim().replace(/[^a-z0-9а-яё]+/gi,'-').replace(/^-|-$/g,'').slice(0,40)||'game'; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function addObject(kind){
  if(kind==='duplicate' && selectedId){
    const src=gameData.objects.find(o=>o.id===selectedId);
    if(!src) return;
    const clone={...src, id:uid('obj'), name:src.name+' копия', x:src.x+20, y:src.y+20, zIndex:gameData.objects.length};
    gameData.objects.push(clone);
    gameData.scripts[clone.id]= JSON.parse(JSON.stringify(gameData.scripts[selectedId]||[]));
    selectedId=clone.id; saveLocal(); renderAllEditor(); return;
  }
  const id=uid('obj');
  const base={id, x:80+Math.random()*200, y:60+Math.random()*160, width:80, height:60, rotation:0, opacity:1, color:'#4f7cff', text:'', fontSize:14, visible:true, spriteId:null, zIndex:gameData.objects.length};
  if(kind==='rect') Object.assign(base,{name:'Прямоугольник', type:'rect', color:'#4f7cff'});
  if(kind==='circle') Object.assign(base,{name:'Круг', type:'circle', width:60,height:60, color:'#ff6b6b'});
  if(kind==='sprite') Object.assign(base,{name:'Спрайт', type:'sprite', width:80,height:80, color:'transparent', spriteId: gameData.assets.sprites[0]?.id||null});
  if(kind==='text') Object.assign(base,{name:'Текст', type:'text', width:160,height:30, color:'#ffffff', text:'Привет! Счёт {очки}', fontSize:16});
  if(kind==='button') Object.assign(base,{name:'Кнопка', type:'button', width:120,height:36, color:'#10b981', text:'Играть', fontSize:13});
  gameData.objects.push(base);
  selectedId=id; saveLocal(); renderAllEditor();
}
function renderAllEditor(){ renderObjectList(); renderStage(); renderProps(); renderScriptArea(); }

function renderObjectList(){
  const list=document.getElementById('objList'); if(!list) return;
  list.innerHTML='';
  // sort by zIndex
  const sorted=[...gameData.objects].sort((a,b)=>a.zIndex-b.zIndex);
  sorted.forEach(o=>{
    const isSel=o.id===selectedId;
    const div=document.createElement('div');
    div.className='obj-item'+(isSel?' active':'');
    div.innerHTML=`
      <div class="obj-icon">${o.type==='rect'?'▭':o.type==='circle'?'●':o.type==='sprite'?'🖼️':o.type==='text'?'🔤':'🔘'}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(o.name)}</div>
        <div style="font-size:10px;color:var(--muted)">${o.type} • z:${o.zIndex} ${o.visible===false?'• скрыт':''}</div>
      </div>
      <div class="obj-item-actions">
        <button class="icon-btn" title="вверх" data-up="${o.id}">↑</button>
        <button class="icon-btn" title="вниз" data-down="${o.id}">↓</button>
        <button class="icon-btn" title="удалить" data-del="${o.id}">✕</button>
      </div>
    `;
    div.addEventListener('click', (e)=>{
      if(e.target.closest('.icon-btn')) return;
      selectedId=o.id; renderAllEditor();
    });
    // actions
    div.querySelector('[data-up]')?.addEventListener('click',()=>{ o.zIndex+=1; saveLocal(); renderAllEditor(); });
    div.querySelector('[data-down]')?.addEventListener('click',()=>{ o.zIndex=Math.max(0,o.zIndex-1); saveLocal(); renderAllEditor(); });
    div.querySelector('[data-del]')?.addEventListener('click',()=>{
      if(gameData.objects.length<=1) return toast('Должен остаться хотя бы один объект');
      if(!confirm('Удалить объект "'+o.name+'" ?')) return;
      gameData.objects=gameData.objects.filter(x=>x.id!==o.id);
      delete gameData.scripts[o.id];
      if(selectedId===o.id) selectedId=gameData.objects[0]?.id||null;
      saveLocal(); renderAllEditor();
    });
    list.appendChild(div);
  });
}

function renderAssets(){
  const thumbs=document.getElementById('spriteThumbs'); const sndList=document.getElementById('soundList');
  if(thumbs){
    thumbs.innerHTML='';
    gameData.assets.sprites.forEach(s=>{
      const d=document.createElement('div'); d.className='asset-thumb';
      d.innerHTML=`<img src="${s.dataUrl}" alt=""><button style="position:absolute;top:4px;right:4px" class="icon-btn">✕</button><span style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);font-size:9px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(s.name)}</span>`;
      d.querySelector('button').addEventListener('click',()=>{
        gameData.assets.sprites=gameData.assets.sprites.filter(x=>x.id!==s.id);
        // clear refs
        gameData.objects.forEach(o=>{ if(o.spriteId===s.id) o.spriteId=null; });
        saveLocal(); renderAssets(); renderStage(); renderProps(); renderScriptArea();
      });
      thumbs.appendChild(d);
    });
    if(gameData.assets.sprites.length===0) thumbs.innerHTML='<span style="font-size:11px;color:var(--muted)">Нет спрайтов</span>';
    // update sprite selects in blocks by re-rendering palette area
  }
  if(sndList){
    sndList.innerHTML='';
    gameData.assets.sounds.forEach(s=>{
      const row=document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 8px';
      row.innerHTML=`<span style="font-size:12px">🔊</span><span style="font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(s.name)}</span><audio controls src="${s.dataUrl}" style="width:90px;height:24px"></audio><button class="icon-btn">✕</button>`;
      row.querySelector('button').addEventListener('click',()=>{
        gameData.assets.sounds=gameData.assets.sounds.filter(x=>x.id!==s.id);
        saveLocal(); renderAssets();
      });
      sndList.appendChild(row);
    });
    if(gameData.assets.sounds.length===0) sndList.innerHTML='<span style="font-size:11px;color:var(--muted)">Нет звуков</span>';
  }
}

async function handleFiles(fileList, kind){
  const files=[...fileList];
  for(const f of files){
    const dataUrl=await new Promise((res,rej)=>{
      const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f);
    });
    if(kind==='sprite'){
      gameData.assets.sprites.push({id:uid('spr'), name:f.name, dataUrl, mime:f.type});
    } else {
      gameData.assets.sounds.push({id:uid('snd'), name:f.name, dataUrl, mime:f.type});
    }
  }
  saveLocal(); renderAssets(); renderPalette(); toast('Файлы загружены ✓');
}

function renderVarsPanel(){
  const el=document.getElementById('varsPanel'); if(!el) return;
  el.innerHTML=`
    <div class="kv"><input id="newVarName" placeholder="имя переменной" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:8px;font-size:11px"><button class="btn btn-sm" id="btnAddVar">+ Переменная</button></div>
    <div id="varsList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px"></div>
    <div class="kv"><input id="newListName" placeholder="имя списка" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:8px;font-size:11px"><button class="btn btn-sm" id="btnAddList">+ Список</button></div>
    <div id="listsList" style="display:flex;flex-direction:column;gap:6px"></div>
  `;
  const varsList=el.querySelector('#varsList');
  gameData.variables.forEach((v,i)=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;gap:6px;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 8px';
    row.innerHTML=`<span style="font-size:11px;font-weight:700;min-width:60px">${escapeHtml(v.name)}</span><input data-vi="${i}" value="${escapeHtml(String(v.value))}" style="flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:6px;font-size:11px"><button class="icon-btn" data-delvar="${i}">✕</button>`;
    row.querySelector('input').addEventListener('input', e=>{
      const val=e.target.value; const num=Number(val); v.value=isNaN(num)||val.trim()===''||isNaN(Number(val)) && val!==''? val : num;
      // keep string if not number? simple: if can parse as number, store number else string
      if(!isNaN(Number(val)) && val.trim()!=='') v.value=Number(val); else v.value=val;
      saveLocal();
    });
    row.querySelector('[data-delvar]').addEventListener('click',()=>{
      gameData.variables.splice(i,1); saveLocal(); renderVarsPanel(); renderPalette(); renderScriptArea();
    });
    varsList.appendChild(row);
  });
  if(gameData.variables.length===0) varsList.innerHTML='<span style="font-size:11px;color:var(--muted)">Нет переменных — создай «очки»</span>';
  const listsList=el.querySelector('#listsList');
  gameData.lists.forEach((l,i)=>{
    const row=document.createElement('div');
    row.style.cssText='background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px';
    row.innerHTML=`<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><span style="font-size:11px;font-weight:700">${escapeHtml(l.name)}</span><span class="badge">${l.items.length}</span><button class="icon-btn" data-dellist="${i}" style="margin-left:auto">✕</button></div>
    <div style="display:flex;gap:6px;margin-bottom:6px"><input data-listinput="${i}" placeholder="элемент" style="flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:6px;font-size:11px"><button class="btn btn-sm" data-additem="${i}">+ добавить</button></div>
    <div style="font-size:11px;color:var(--muted);word-break:break-all">${escapeHtml(l.items.join(', ')||'— пусто —')}</div>`;
    row.querySelector('[data-additem]').addEventListener('click',()=>{
      const inp=row.querySelector('[data-listinput]'); const val=inp.value.trim(); if(!val) return; l.items.push(val); inp.value=''; saveLocal(); renderVarsPanel();
    });
    row.querySelector('[data-dellist]').addEventListener('click',()=>{ gameData.lists.splice(i,1); saveLocal(); renderVarsPanel(); renderPalette(); });
    listsList.appendChild(row);
  });
  if(gameData.lists.length===0) listsList.innerHTML='<span style="font-size:11px;color:var(--muted)">Нет списков</span>';
  el.querySelector('#btnAddVar').addEventListener('click',()=>{
    const inp=el.querySelector('#newVarName'); const name=inp.value.trim().replace(/\s+/g,'_'); if(!name) return toast('Введите имя'); if(gameData.variables.find(v=>v.name===name)) return toast('Уже есть'); gameData.variables.push({name, value:0}); inp.value=''; saveLocal(); renderVarsPanel(); renderPalette();
  });
  el.querySelector('#btnAddList').addEventListener('click',()=>{
    const inp=el.querySelector('#newListName'); const name=inp.value.trim().replace(/\s+/g,'_'); if(!name) return toast('Введите имя'); if(gameData.lists.find(l=>l.name===name)) return toast('Уже есть'); gameData.lists.push({name, items:[]}); inp.value=''; saveLocal(); renderVarsPanel(); renderPalette();
  });
}

function renderProps(){
  const el=document.getElementById('propsPanel'); if(!el) return;
  const o=gameData.objects.find(x=>x.id===selectedId);
  document.getElementById('selectedInfo').textContent = o? `${o.name} (${o.type})` : '—';
  if(!o){ el.innerHTML='<div style="color:var(--muted);font-size:12px">Выбери объект на сцене</div>'; return; }
  el.innerHTML=`
    <div class="form-group"><label>Имя</label><input id="pName" value="${escapeHtml(o.name)}"></div>
    <div class="row2">
      <div class="form-group"><label>X</label><input id="pX" type="number" value="${o.x}"></div>
      <div class="form-group"><label>Y</label><input id="pY" type="number" value="${o.y}"></div>
    </div>
    <div class="row2">
      <div class="form-group"><label>Ширина</label><input id="pW" type="number" value="${o.width}"></div>
      <div class="form-group"><label>Высота</label><input id="pH" type="number" value="${o.height}"></div>
    </div>
    <div class="row2">
      <div class="form-group"><label>Поворот °</label><input id="pRot" type="number" value="${o.rotation||0}"></div>
      <div class="form-group"><label>Прозрачность</label><input id="pOp" type="number" min="0" max="1" step="0.1" value="${o.opacity??1}"></div>
    </div>
    <div class="form-group"><label>Цвет</label><input id="pColor" type="color" value="${o.color && o.color.startsWith('#')? o.color:'#4f7cff'}" style="height:32px;padding:2px"></div>
    <div class="form-group"><label>Текст / содержимое</label><textarea id="pText" rows="2" placeholder="Текст (для text/button) или эмодзи">${escapeHtml(o.text||'')}</textarea></div>
    <div class="row2">
      <div class="form-group"><label>Размер шрифта</label><input id="pFont" type="number" value="${o.fontSize||14}"></div>
      <div class="form-group"><label>Спрайт</label><select id="pSprite"><option value="">— нет —</option>${gameData.assets.sprites.map(s=>`<option value="${s.id}" ${o.spriteId===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}</select></div>
    </div>
    <label class="checkbox"><input type="checkbox" id="pVis" ${o.visible!==false?'checked':''}> Видимый</label>
  `;
  const bind=(id,ev,fn)=> el.querySelector('#'+id)?.addEventListener(ev,fn);
  bind('pName','input',e=>{o.name=e.target.value; saveLocal(); renderObjectList();});
  bind('pX','input',e=>{o.x=Number(e.target.value)||0; saveLocal(); renderStage();});
  bind('pY','input',e=>{o.y=Number(e.target.value)||0; saveLocal(); renderStage();});
  bind('pW','input',e=>{o.width=Math.max(5,Number(e.target.value)||5); saveLocal(); renderStage();});
  bind('pH','input',e=>{o.height=Math.max(5,Number(e.target.value)||5); saveLocal(); renderStage();});
  bind('pRot','input',e=>{o.rotation=Number(e.target.value)||0; saveLocal(); renderStage();});
  bind('pOp','input',e=>{o.opacity=Math.max(0,Math.min(1,Number(e.target.value)||0)); saveLocal(); renderStage();});
  bind('pColor','input',e=>{o.color=e.target.value; saveLocal(); renderStage();});
  bind('pText','input',e=>{o.text=e.target.value; saveLocal(); renderStage();});
  bind('pFont','input',e=>{o.fontSize=Number(e.target.value)||14; saveLocal(); renderStage();});
  bind('pSprite','change',e=>{o.spriteId=e.target.value||null; if(o.spriteId) o.type='sprite'; saveLocal(); renderStage();});
  bind('pVis','change',e=>{o.visible=e.target.checked; saveLocal(); renderStage(); renderObjectList();});
}

function renderStage(){
  const stage=document.getElementById('stage'); if(!stage) return;
  stage.style.width=gameData.meta.width+'px';
  stage.style.height=gameData.meta.height+'px';
  stage.style.background=gameData.meta.bgColor||'#0f172a';
  stage.innerHTML='';
  // sort by zIndex
  const sorted=[...gameData.objects].sort((a,b)=>a.zIndex-b.zIndex);
  sorted.forEach(o=>{
    const el=document.createElement('div');
    el.className='stage-object'+(o.id===selectedId?' selected':'');
    el.style.left=o.x+'px'; el.style.top=o.y+'px';
    el.style.width=o.width+'px'; el.style.height=o.height+'px';
    el.style.transform='rotate('+(o.rotation||0)+'deg)';
    el.style.opacity= o.visible===false? '0' : (o.opacity??1);
    el.style.display= o.visible===false? 'none':'flex';
    el.style.zIndex=o.zIndex;
    el.style.background= o.type==='rect'? (o.color||'#4f7cff') : o.type==='circle'? (o.color||'#ff6b6b') : o.type==='button'? (o.color||'#4f7cff') : 'transparent';
    if(o.type==='circle') el.style.borderRadius='50%'; else if(o.type==='button') el.style.borderRadius='8px';
    if(o.type==='sprite'){
      const spr=gameData.assets.sprites.find(s=>s.id===o.spriteId);
      if(spr){ el.style.backgroundImage='url('+spr.dataUrl+')'; el.style.backgroundSize='cover'; el.style.backgroundPosition='center'; }
      else { el.style.background='#2a303f'; el.innerHTML='<span style="font-size:10px;color:#8a90a3">no sprite</span>'; }
    } else if(o.type==='text'){
      el.style.background='transparent';
      el.style.color=o.color||'#fff';
      el.style.fontSize=(o.fontSize||16)+'px';
      el.style.fontWeight='700';
      el.textContent=o.text||'Текст';
    } else if(o.type==='rect' || o.type==='circle' || o.type==='button'){
      el.innerHTML=`<span class="obj-label" style="color:white;font-size:${o.fontSize||12}px">${escapeHtml(o.text||'')}</span>`;
      if(o.type==='button') el.style.boxShadow='0 3px 0 rgba(0,0,0,.25)';
    }
    el.addEventListener('mousedown', (e)=> startDrag(e,o.id));
    el.addEventListener('touchstart', (e)=> startDrag(e.touches[0],o.id), {passive:false});
    el.addEventListener('click', (e)=>{ e.stopPropagation(); selectedId=o.id; renderAllEditor(); });
    stage.appendChild(el);
  });
  // click on empty stage
  stage.onclick=(e)=>{
    if(e.target===stage){ selectedId=null; renderProps(); renderScriptArea(); document.getElementById('selectedInfo').textContent='—'; // keep stage selection clear but re-render to remove outline
      renderStage();
    }
  };
}
function startDrag(e, id){
  e.preventDefault();
  const o=gameData.objects.find(x=>x.id===id);
  if(!o) return;
  selectedId=id; renderProps(); renderScriptArea();
  const stage=document.getElementById('stage');
  const rect=stage.getBoundingClientRect();
  const startX=e.clientX - rect.left;
  const startY=e.clientY - rect.top;
  const offsetX=startX - o.x;
  const offsetY=startY - o.y;
  dragging={id, offsetX, offsetY};
  function onMove(ev){
    if(!dragging) return;
    const p=ev.touches? ev.touches[0]: ev;
    const curX=p.clientX - rect.left;
    const curY=p.clientY - rect.top;
    o.x=Math.round(curX - dragging.offsetX);
    o.y=Math.round(curY - dragging.offsetY);
    // clamp
    o.x=Math.max(-o.width+20, Math.min(gameData.meta.width-20, o.x));
    o.y=Math.max(-o.height+20, Math.min(gameData.meta.height-20, o.y));
    renderStage(); renderProps();
  }
  function onUp(){
    dragging=null; saveLocal();
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
    window.removeEventListener('touchmove', onMove);
    window.removeEventListener('touchend', onUp);
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('touchend', onUp);
}

function renderPalette(){
  const pal=document.getElementById('palette'); if(!pal) return;
  const groups=[
    {cat:'events', title:'▶ События', icon:'⚡'},
    {cat:'motion', title:'↗ Движение', icon:'↗'},
    {cat:'looks', title:'👁 Внешность', icon:'👁'},
    {cat:'sound', title:'🔊 Звук', icon:'🔊'},
    {cat:'control', title:'⚙ Управление', icon:'⚙'},
    {cat:'vars', title:'🧮 Переменные', icon:'🧮'},
    {cat:'lists', title:'📋 Списки', icon:'📋'},
  ];
  pal.innerHTML='';
  groups.forEach(g=>{
    const wrap=document.createElement('div'); wrap.className='palette-group';
    wrap.innerHTML=`<div class="palette-title ${g.cat}">${escapeHtml(g.title)}</div><div class="palette-body" id="pg_${g.cat}"></div>`;
    pal.appendChild(wrap);
    const body=wrap.querySelector('.palette-body');
    BLOCKS.filter(b=>b.cat===g.cat).forEach(b=>{
      const btn=document.createElement('button');
      btn.className='block-btn';
      btn.style.background= catColor(b.cat)+'18';
      btn.style.borderColor= catColor(b.cat)+'40';
      btn.style.color= catColor(b.cat);
      btn.textContent=b.label;
      const plus=document.createElement('span'); plus.textContent='+'; plus.style.fontWeight='800';
      btn.appendChild(plus);
      btn.addEventListener('click',()=>{
        if(!selectedId) return toast('Выбери объект слева');
        if(!gameData.scripts[selectedId]) gameData.scripts[selectedId]=[];
        // clone block with defaults
        const params={};
        b.params.forEach(p=> params[p.name]=p.def);
        gameData.scripts[selectedId].push({op:b.op, params, cat:b.cat, label:b.label});
        saveLocal(); renderScriptArea();
      });
      body.appendChild(btn);
    });
  });
}

function renderScriptArea(){
  const area=document.getElementById('scriptArea'); const forEl=document.getElementById('scriptFor'); const countEl=document.getElementById('scriptCount');
  if(!area) return;
  const obj=gameData.objects.find(x=>x.id===selectedId);
  if(!obj){ area.innerHTML='<div class="script-empty">Выбери объект, чтобы редактировать блоки</div>'; if(forEl) forEl.textContent='—'; if(countEl) countEl.textContent='0'; return; }
  if(forEl) forEl.textContent=obj.name;
  const scripts=gameData.scripts[selectedId]||[];
  if(countEl) countEl.textContent=String(scripts.length);
  if(scripts.length===0){ area.innerHTML='<div class="script-empty">Нет блоков. Добавь блоки из палитры выше.<br><br>Пример: <b>когда клик</b> → <b>изменить X</b> → <b>сохранить переменную</b></div>'; return; }
  area.innerHTML='';
  scripts.forEach((b, idx)=>{
    const def=BLOCKS.find(x=>x.op===b.op) || {params:[]};
    const card=document.createElement('div'); card.className='block-card '+b.cat;
    let inner=`<span style="font-weight:700;color:${catColor(b.cat)}">${escapeHtml(b.label)}</span>`;
    // render params as inputs
    const paramsWrap=document.createElement('span'); paramsWrap.style.display='inline-flex'; paramsWrap.style.gap='6px'; paramsWrap.style.flexWrap='wrap'; paramsWrap.style.alignItems='center';
    def.params.forEach(p=>{
      const val=b.params[p.name];
      let input;
      if(p.type==='var'){
        input=document.createElement('select');
        gameData.variables.forEach(v=>{ const o=document.createElement('option'); o.value=v.name; o.textContent=v.name; if(v.name===val) o.selected=true; input.appendChild(o); });
        if(gameData.variables.length===0){ const o=document.createElement('option'); o.value=''; o.textContent='— нет переменных —'; input.appendChild(o); }
      } else if(p.type==='list'){
        input=document.createElement('select');
        gameData.lists.forEach(l=>{ const o=document.createElement('option'); o.value=l.name; o.textContent=l.name; if(l.name===val) o.selected=true; input.appendChild(o); });
        if(gameData.lists.length===0){ const o=document.createElement('option'); o.value=''; o.textContent='— нет списков —'; input.appendChild(o); }
      } else if(p.type==='sprite'){
        input=document.createElement('select');
        const none=document.createElement('option'); none.value=''; none.textContent='—'; input.appendChild(none);
        gameData.assets.sprites.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; if(s.id===val) o.selected=true; input.appendChild(o); });
      } else if(p.type==='sound'){
        input=document.createElement('select');
        const none=document.createElement('option'); none.value=''; none.textContent='—'; input.appendChild(none);
        gameData.assets.sounds.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.name; if(s.id===val) o.selected=true; input.appendChild(o); });
      } else if(p.type==='number'){
        input=document.createElement('input'); input.type='number'; input.value=val;
      } else {
        input=document.createElement('input'); input.type='text'; input.value=val;
      }
      input.title=p.label;
      input.addEventListener('input',()=>{ // for select also change fires input
        const v=input.value;
        // number?
        if(p.type==='number') b.params[p.name]=Number(v)||0;
        else b.params[p.name]=v;
        saveLocal();
      });
      input.addEventListener('change',()=>{
        const v=input.value;
        if(p.type==='number') b.params[p.name]=Number(v)||0;
        else b.params[p.name]=v;
        saveLocal();
      });
      const labelSpan=document.createElement('span'); labelSpan.style.fontSize='10px'; labelSpan.style.color='var(--muted)'; labelSpan.textContent=p.label;
      const wrap=document.createElement('span'); wrap.style.display='inline-flex'; wrap.style.alignItems='center'; wrap.style.gap='4px';
      wrap.appendChild(labelSpan); wrap.appendChild(input);
      paramsWrap.appendChild(wrap);
    });
    card.innerHTML=inner;
    if(def.params.length) card.appendChild(paramsWrap);
    // controls
    const ctrls=document.createElement('span'); ctrls.style.marginLeft='auto'; ctrls.style.display='flex'; ctrls.style.gap='4px';
    const up=document.createElement('button'); up.className='icon-btn'; up.textContent='↑'; up.title='вверх';
    const down=document.createElement('button'); down.className='icon-btn'; down.textContent='↓'; down.title='вниз';
    const del=document.createElement('button'); del.className='del'; del.textContent='✕';
    up.addEventListener('click',()=>{ if(idx>0){ const a=scripts[idx-1]; scripts[idx-1]=b; scripts[idx]=a; saveLocal(); renderScriptArea(); }});
    down.addEventListener('click',()=>{ if(idx<scripts.length-1){ const a=scripts[idx+1]; scripts[idx+1]=b; scripts[idx]=a; saveLocal(); renderScriptArea(); }});
    del.addEventListener('click',()=>{ scripts.splice(idx,1); saveLocal(); renderScriptArea(); });
    ctrls.appendChild(up); ctrls.appendChild(down); ctrls.appendChild(del);
    card.appendChild(ctrls);
    area.appendChild(card);
  });
}

function copyScriptToAnother(){
  if(!selectedId) return toast('Выбери объект');
  const src=gameData.scripts[selectedId]||[]; if(src.length===0) return toast('Нет блоков для копирования');
  const targets=gameData.objects.filter(o=>o.id!==selectedId);
  if(targets.length===0) return toast('Нет других объектов');
  const choice=prompt('Введи имя объекта, куда скопировать:\n'+targets.map(o=>o.name).join(', '));
  if(!choice) return;
  const tgt=targets.find(o=>o.name.toLowerCase()===choice.toLowerCase());
  if(!tgt) return toast('Объект не найден');
  gameData.scripts[tgt.id]=JSON.parse(JSON.stringify(src));
  saveLocal(); toast('Скопировано в '+tgt.name);
}

// ---------- JSON export/import ----------
function exportJSON(){
  const blob=new Blob([JSON.stringify(gameData,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=slugify(gameData.meta.title)+'.json'; a.click();
}
function importJSON(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); gameData=j; if(!gameData.scripts) gameData.scripts={}; selectedId=gameData.objects[0]?.id||null; saveLocal(); renderEditor(); toast('JSON загружен ✓'); }catch{ toast('Ошибка JSON'); } }; r.readAsText(f);
}
